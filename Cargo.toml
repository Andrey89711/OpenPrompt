[package]
name = "openprompt"
version = "0.2.0"
edition = "2021"
description = "A fast, configurable prompt for PowerShell"
license = "MIT"
repository = "https://github.com/Andrey89711/OpenPrompt"
readme = "README.md"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
toml_edit = "0.22"
unicode-width = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
