name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Check tag against Cargo package version
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "openprompt"), end="")')
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag does not match Cargo package version $version" >&2; exit 1; }
      # Each runner tests its native architecture, including Apple Silicon.
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build release executable
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: PowerShell integration smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-powershell.ps1 -Executable ./target/${{ matrix.target }}/release/openprompt.exe
      - name: Collect third-party license texts
        run: python scripts/third-party-notices.py --target ${{ matrix.target }}
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item "target/$env:TARGET/release/openprompt.exe" package/
          Copy-Item LICENSE, README.md, THIRD_PARTY_NOTICES.txt package/
          Compress-Archive -Path package/* -DestinationPath "openprompt-$env:GITHUB_REF_NAME-$env:TARGET.zip"
      - name: Package Unix release
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir package
          cp "target/$TARGET/release/openprompt" LICENSE README.md THIRD_PARTY_NOTICES.txt package/
          tar -czf "openprompt-$GITHUB_REF_NAME-$TARGET.tar.gz" -C package openprompt LICENSE README.md THIRD_PARTY_NOTICES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            openprompt-*.zip
            openprompt-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release and checksums
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Generate checksums and publish
        shell: bash
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          archives=(openprompt-*.zip openprompt-*.tar.gz)
          test "${#archives[@]}" -eq 4
          sha256sum "${archives[@]}" > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" "${archives[@]}" SHA256SUMS --verify-tag --generate-notes --title "OpenPrompt $GITHUB_REF_NAME"
